# PCa mHealth reverse proxy: TEMPLATE for deployment, not used in local development.
# It terminates TLS 1.3, routes /api to the backend instances (load balancing) and
# serves the admin website. Replace the server name and certificate paths, and put
# the backend instances' real addresses in the upstream block.
# Checked with: nginx -t (see README.md).

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  server_tokens off;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Several stateless backend instances; rate limits are shared through Redis.
  upstream pca_api {
    least_conn;
    server api-1:3000 max_fails=3 fail_timeout=10s;
    server api-2:3000 max_fails=3 fail_timeout=10s;
    keepalive 32;
  }

  # Plain HTTP only redirects to HTTPS.
  server {
    listen 80;
    server_name api.example.org;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name api.example.org;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    # Imaging and slide uploads stream straight through to the backend.
    client_max_body_size 2100m;
    proxy_request_buffering off;
    proxy_read_timeout 120s;

    location /api/ {
      proxy_pass http://pca_api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
    }

    # Everything else is refused: the API is the only door.
    location / {
      return 404;
    }
  }

  # The admin website: static files built by `npm run build` (1-presentation-layer/admin-panel-web/dist).
  server {
    listen 443 ssl;
    http2 on;
    server_name admin.example.org;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    root /usr/share/nginx/admin;
    location / {
      try_files $uri /index.html;
    }
  }
}
