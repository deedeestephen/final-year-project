name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Folders follow the six architecture layers (see README.md).
env:
  GATE: ${{ github.workspace }}/6-infrastructure/scripts/quality-gate.sh

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: 3-application-logic/backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: 3-application-logic/backend/package-lock.json }
      - run: npm ci
      - run: $GATE backend

  database:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: 3-application-logic/backend } }
    env:
      # Throwaway CI-only credentials for ephemeral service containers (not secrets).
      DATABASE_URL: postgresql://pca:ci-postgres@localhost:5432/pca_mhealth?schema=public
      MONGO_URL: mongodb://pca:ci-mongo@localhost:27018/pca_mhealth?authSource=admin
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: ciminio
      S3_SECRET_KEY: ci-minio-secret
      QDRANT_URL: http://localhost:6333
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: pca, POSTGRES_PASSWORD: ci-postgres, POSTGRES_DB: pca_mhealth }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U pca" --health-interval 5s --health-retries 10
      mongo:
        image: mongo:7
        env: { MONGO_INITDB_ROOT_USERNAME: pca, MONGO_INITDB_ROOT_PASSWORD: ci-mongo }
        ports: ["27018:27017"]
      qdrant:
        image: qdrant/qdrant:v1.15.4
        ports: ["6333:6333"]
    steps:
      - uses: actions/checkout@v4
      - name: Start MinIO (service containers cannot pass a start command)
        working-directory: .
        run: |
          image=$(grep -oE 'quay.io/minio/minio@sha256:[0-9a-f]+' 6-infrastructure/docker/docker-compose.yml)
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=ciminio -e MINIO_ROOT_PASSWORD=ci-minio-secret "$image" server /data
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: 3-application-logic/backend/package-lock.json }
      - run: npm ci
      - name: Generate throwaway JWT and field-encryption keys for this CI run
        run: node ../../6-infrastructure/scripts/gen-keys.mjs >> "$GITHUB_ENV"
      - run: $GATE db

  # Phase 16: the six workflows against the real system (built backend in
  # production mode, the Python AI service, the databases, a SmartCare Pro
  # stand-in over HTTPS), then the log review.
  workflows:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: 3-application-logic/backend } }
    env:
      # Throwaway CI-only credentials for ephemeral service containers (not secrets).
      DATABASE_URL: postgresql://pca:ci-postgres@localhost:5432/pca_mhealth?schema=public
      MONGO_URL: mongodb://pca:ci-mongo@localhost:27018/pca_mhealth?authSource=admin
      S3_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: ciminio
      S3_SECRET_KEY: ci-minio-secret
      QDRANT_URL: http://localhost:6333
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: pca, POSTGRES_PASSWORD: ci-postgres, POSTGRES_DB: pca_mhealth }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U pca" --health-interval 5s --health-retries 10
      mongo:
        image: mongo:7
        env: { MONGO_INITDB_ROOT_USERNAME: pca, MONGO_INITDB_ROOT_PASSWORD: ci-mongo }
        ports: ["27018:27017"]
      qdrant:
        image: qdrant/qdrant:v1.15.4
        ports: ["6333:6333"]
    steps:
      - uses: actions/checkout@v4
      - name: Start MinIO (service containers cannot pass a start command)
        working-directory: .
        run: |
          image=$(grep -oE 'quay.io/minio/minio@sha256:[0-9a-f]+' 6-infrastructure/docker/docker-compose.yml)
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=ciminio -e MINIO_ROOT_PASSWORD=ci-minio-secret "$image" server /data
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: AI service (mock models) in its own virtual environment
        working-directory: 4-ai-intelligence-layer/ai-services
        run: python -m venv .venv && .venv/bin/python -m pip install --upgrade pip && .venv/bin/pip install -e .
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: 3-application-logic/backend/package-lock.json }
      - run: npm ci
      - name: Generate throwaway JWT and field-encryption keys for this CI run
        run: node ../../6-infrastructure/scripts/gen-keys.mjs >> "$GITHUB_ENV"
      - run: $GATE workflows

  ai-services:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: 4-ai-intelligence-layer/ai-services } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m venv .venv && .venv/bin/python -m pip install --upgrade pip && .venv/bin/pip install -e ".[dev]"
      - run: $GATE ai

  mobile:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: 1-presentation-layer/mobile-app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: "3.35.2", channel: stable, cache: true }
      - run: flutter pub get
      - run: $GATE mobile

  admin-web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: 1-presentation-layer/admin-panel-web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: 1-presentation-layer/admin-panel-web/package-lock.json }
      - run: npm ci
      - run: $GATE admin-web

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: $GATE docs

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
