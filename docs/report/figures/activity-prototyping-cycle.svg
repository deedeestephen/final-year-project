phone app,</text><text x="305.022" y="589.855" fill="#0F172A" font-size="23.021" textLength="147.399" font-family="'Segoe UI'">admin website</text><rect x="260.364" y="648.758" width="557.252" height="157.895" fill="#EFF6FF" style="stroke:#2563EB;stroke-width:0.885;" rx="10.625" ry="10.625"/><text x="278.073" y="691.308" fill="#0F172A" font-size="23.021" textLength="485.596" font-family="'Segoe UI'">Internal testing: unit, database and widget tests,</text><text x="278.073" y="721.928" fill="#0F172A" font-size="23.021" textLength="441.116" font-family="'Segoe UI'">then the quality gate for each changed part</text><text x="278.073" y="752.547" fill="#0F172A" font-size="23.021" textLength="521.836" font-family="'Segoe UI'">(format, lint, types, tests, coverage of 80 % or more,</text><text x="278.073" y="783.167" fill="#0F172A" font-size="23.021" textLength="121.185" font-family="'Segoe UI'">build, audit)</text><polygon points="473.71,844.613,604.271,844.613,625.521,865.863,604.271,887.113,473.71,887.113,452.46,865.863,473.71,844.613" fill="#FEF3C7" style="stroke:#B45309;stroke-width:0.885;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="473.71" y="875.395" fill="#0F172A" font-size="23.021" textLength="130.56" font-family="'Segoe UI'">Gate passes?</text><text x="430.023" y="860.974" fill="#334155" font-size="19.479" textLength="22.437" font-family="'Segoe UI'">no</text><text x="625.521" y="860.974" fill="#334155" font-size="19.479" textLength="27.878" font-family="'Segoe UI'">yes</text><rect x="68.248" y="904.821" width="439.675" height="96.656" fill="#EFF6FF" style="stroke:#2563EB;stroke-width:0.885;" rx="10.625" ry="10.625"/><text x="85.956" y="947.372" fill="#0F172A" font-size="23.021" textLength="404.258" font-family="'Segoe UI'">Fix the code, or the test if the behaviour</text><text x="85.956" y="977.991" fill="#0F172A" font-size="23.021" textLength="293.28" font-family="'Segoe UI'">should change (and say why)</text><rect x="543.339" y="904.821" width="493.11