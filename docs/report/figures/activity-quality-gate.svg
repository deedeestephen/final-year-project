ext x="934.54" y="247.794" fill="#0F172A" font-size="23.021" textLength="396.716" font-family="'Segoe UI'">admin-web, fhir, tls, docs, secrets, or all</text><rect x="28.333" y="309.619" width="2355.312" height="10.625" fill="#1D4ED8" style="stroke:#1D4ED8;stroke-width:1.771;" rx="4.427" ry="4.427"/><rect x="49.583" y="355.661" width="341.567" height="249.753" fill="#EFF6FF" style="stroke:#2563EB;stroke-width:0.885;" rx="10.625" ry="10.625"/><text x="67.292" y="398.211" fill="#0F172A" font-size="23.021" textLength="91.218" font-weight="700" font-family="'Segoe UI'">backend</text><text x="67.292" y="428.83" fill="#0F172A" font-size="23.021" textLength="264.414" font-family="'Segoe UI'">Prettier, ESLint, TypeScript</text><text x="67.292" y="459.45" fill="#0F172A" font-size="23.021" textLength="153.086" font-family="'Segoe UI'">Prisma validate</text><text x="67.292" y="490.069" fill="#0F172A" font-size="23.021" textLength="274.643" font-family="'Segoe UI'">unit tests, end-to-end tests</text><text x="67.292" y="520.689" fill="#0F172A" font-size="23.021" textLength="306.15" font-family="'Segoe UI'">OpenAPI, FHIR definitions and</text><text x="67.292" y="551.308" fill="#0F172A" font-size="23.021" textLength="246.226" font-family="'Segoe UI'">access matrix up to date</text><text x="67.292" y="581.928" fill="#0F172A" font-size="23.021" textLength="232.322" font-family="'Segoe UI'">build, npm audit (high)</text><rect x="408.858" y="401.59" width="405.245" height="157.895" fill="#EFF6FF" style="stroke:#2563EB;stroke-width:0.885;" rx="10.625" ry="10.625"/><text x="426.567" y="444.14" fill="#0F172A" font-size="23.021" textLength="28.529" font-weight="700" font-family="'Segoe UI'">db</text><text x="426.567" y="474.76" fill="#0F172A" font-size="23.021" textLength="190.169" font-family="'Segoe UI'">migrations applied</text><text x="426.567" y="505.379" fill="#0F172A" font-size="23.021" textLength="369.828" font-family="'Segoe UI'">all tests with PostgreSQL, MongoDB,</text><text x="426.567" y="535.999" fill="#0F172A" font-size="23.021" textLength="253.802" font-family="'Segoe UI'">MinIO (coverage ≥ 80 %)</text><rect x="863.687" y="401.59" width="295.031" height="157.895" fill="#EFF6FF" style="stroke:#2563EB;stroke-width:0.885;" rx="10.625" ry="10.625"/><text x="881.395" y="444.14" fill="#0F172A" font-size="23.021" textLength="18.929" font-weight="700" font-family="'Segoe UI'">ai</text><text x="881.395" y="474.76" fill="#0F172A" font-size="23.021" textLength="259.614" font-family="'Segoe UI'">ruff format and lint, mypy</text><text x="881.395" y="505.379" fill="#0F172A" font-size="23.021" textLength="253.128" font-family="'Segoe UI'">pytest (coverage ≥ 80 %)</text><text x="881.395" y="535.999" fill="#0F172A" font-size="23.021" textLength="93.522" font-family="'Segoe UI'">pip-audit</text><rect x="1208.301" y="386.28" width="374.153" height="188.514" fill="#EFF6FF" style="stroke:#2563EB;stroke-width:0.885;" rx="10.625" ry="10.625"/><text x="1226.009" y="428.83" fill="#0F172A" font-size="23.021" textLength="74.975" font-weight="700" font-family="'Segoe UI'">mobile</text><text x="1226.009" y="459.45" fill="#0F172A" font-size="23.021" textLength="270.09" font-family="'Segoe UI'">dart format, flutter analyze</text><text x="1226.009" y="490.069" fill="#0F172A" font-size="23.021" textLength="338.737" font-family="'Segoe UI'">flutter test (line coverage ≥ 80 %)</text><text x="1226.009" y="520.689" fill="#0F172A" font-size="23.021" textLength="170.689" font-family="'Segoe UI'">debug APK build</text><text x="1226.009" y="551.308" fill="#0F172A" font-size="23.021" textLength="206.693" font-family="'Segoe UI'">package audit (OSV)</text><rect x="1632.037" y="401.59" width="284.374" height="157.895" fill="#EFF6FF" style="stroke:#2563EB;stroke-width:0.885;" rx="10.625" ry="10.625"/><text x="1649.746" y="444.14" fill="#0F172A" font-size="23.021" textLength="122.59" font-weight="700" font-family="'Segoe UI'">admin-web</text><text x="1649.746" y="474.76" fill="#0F